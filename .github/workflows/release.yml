name: Release

# Builds the Windows installer on a real Windows runner and publishes it as a
# GitHub release.
#
# Three ways to start it:
#   * push a v* tag
#   * push a release/v* branch, which publishes that version and is useful when
#     tag pushes are not available
#   * run it by hand from the Actions tab with a tag name
on:
  push:
    tags:
      - 'v*'
    branches:
      - 'release/v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v2.25.0)'
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # sing-box.exe is intentionally not committed (see resources/sing-box/README.txt).
      # Fetch the release the client is built against so the installer ships a
      # working default engine.
      - name: Fetch sing-box engine
        shell: pwsh
        env:
          SING_BOX_VERSION: 1.13.12
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:SING_BOX_VERSION
          $name = "sing-box-$version-windows-amd64"
          $url = "https://github.com/SagerNet/sing-box/releases/download/v$version/$name.zip"
          Invoke-WebRequest -Uri $url -OutFile sing-box.zip
          Expand-Archive -Path sing-box.zip -DestinationPath sing-box-dist -Force
          Copy-Item "sing-box-dist/$name/sing-box.exe" resources/sing-box/sing-box.exe
          & resources/sing-box/sing-box.exe version

      - name: Build installer
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # One extra copy under a fixed name, so the download link in the README
      # never has to be edited: releases/latest/download/Manfaz-VPN-Setup-x64.exe
      #
      # Only two installers are published on purpose. GitHub rewrites every
      # non-ASCII character in a release asset name to a dot, so a Persian
      # label cannot survive as a filename, and a third identical copy would
      # add confusion rather than remove it. The release notes name the file to
      # download instead.
      - name: Add a versionless installer copy
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem release/Manfaz-VPN-Setup-*-x64.exe |
            Where-Object { $_.Name -notmatch 'uninstaller' } |
            Select-Object -First 1
          Copy-Item $installer.FullName 'release/Manfaz-VPN-Setup-x64.exe'
          Get-ChildItem release/*.exe | ForEach-Object { Write-Host $_.Name }

      - name: Resolve release tag
        id: tag
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = if ($env:GITHUB_REF -like 'refs/tags/*') {
            $env:GITHUB_REF -replace '^refs/tags/', ''
          } elseif ($env:GITHUB_REF -like 'refs/heads/release/*') {
            $env:GITHUB_REF -replace '^refs/heads/release/', ''
          } else {
            '${{ github.event.inputs.tag }}'
          }
          if (-not $tag) { throw 'Could not work out which tag to publish.' }
          if (-not (Test-Path "release-notes/$tag.md")) {
            throw "release-notes/$tag.md does not exist."
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          # GITHUB_TOKEN publishes as github-actions[bot]. Add a personal access
          # token with `contents: write` as a RELEASE_TOKEN secret and the
          # release is attributed to you instead; without it this falls back to
          # the built-in token so the workflow still works.
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Manfaz VPN ${{ steps.tag.outputs.tag }}
          body_path: release-notes/${{ steps.tag.outputs.tag }}.md
          draft: false
          files: |
            release/Manfaz-VPN-Setup-x64.exe
            release/Manfaz-VPN-Setup-*-x64.exe
            release/Manfaz-VPN-Setup-*-x64.exe.blockmap
            release/latest.yml

      # Re-running a release leaves behind any asset an earlier run uploaded
      # under a name this run no longer produces. Drop anything that is not
      # part of the expected set so the page only ever shows the current build.
      - name: Remove stale release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $keep = @(
            'latest.yml',
            'Manfaz-VPN-Setup-x64.exe',
            "Manfaz-VPN-Setup-$($env:TAG -replace '^v','')-x64.exe",
            "Manfaz-VPN-Setup-$($env:TAG -replace '^v','')-x64.exe.blockmap"
          )
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept        = 'application/vnd.github+json'
            'User-Agent'  = 'manfaz-release'
          }
          $base = "https://api.github.com/repos/${{ github.repository }}"
          $release = Invoke-RestMethod -Headers $headers -Uri "$base/releases/tags/$env:TAG"
          foreach ($asset in $release.assets) {
            if ($keep -notcontains $asset.name) {
              Write-Host "removing stale asset: $($asset.name)"
              Invoke-RestMethod -Headers $headers -Method Delete -Uri "$base/releases/assets/$($asset.id)"
            }
          }

      # A release/v* branch exists only to start this workflow, and older ones
      # pile up behind it. Delete every temporary branch whose tip is already
      # contained in the default branch, so nothing is lost by removing it.
      - name: Remove merged temporary branches
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept        = 'application/vnd.github+json'
            'User-Agent'  = 'manfaz-release'
          }
          $base = "https://api.github.com/repos/${{ github.repository }}"
          $repo = Invoke-RestMethod -Headers $headers -Uri $base
          $default = $repo.default_branch

          $branches = Invoke-RestMethod -Headers $headers -Uri "$base/branches?per_page=100"
          foreach ($branch in $branches) {
            if ($branch.name -eq $default) { continue }
            if ($branch.name -notlike 'release/*' -and $branch.name -notlike 'claude/*') { continue }

            # compare returns "behind" or "identical" when the branch adds nothing
            # that the default branch does not already have.
            $cmp = Invoke-RestMethod -Headers $headers `
              -Uri "$base/compare/$default...$($branch.name)"
            if ($cmp.ahead_by -eq 0) {
              Write-Host "deleting merged branch: $($branch.name)"
              Invoke-RestMethod -Headers $headers -Method Delete `
                -Uri "$base/git/refs/heads/$($branch.name)"
            } else {
              Write-Host "keeping $($branch.name), it is $($cmp.ahead_by) commit(s) ahead"
            }
          }
